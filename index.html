<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Tracker - Login & Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="js/css/style.css">
  <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body class="bg-light d-flex flex-column min-vh-100 position-relative">

  <div class="position-absolute top-0 end-0 p-3">
    <button id="theme-toggle" class="btn btn-outline-secondary btn-sm d-flex align-items-center">
      <i class="bi bi-moon-fill me-1" id="theme-icon"></i>
      <span id="theme-text">Dark Mode</span>
    </button>
  </div>

  <main class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
    <div class="card shadow-sm border-0 w-100" style="max-width: 420px;">
      <div class="card-body p-4 text-center">
        <div class="mb-3 text-primary">
          <i class="bi bi-mortarboard-fill display-4"></i>
        </div>
        <h3 class="fw-bold mb-1" id="portal-title">COMET</h3>
        <p class="text-muted small mb-4" id="portal-subtitle">Student Performance Tracker</p>

        <div id="auth-alert" class="alert alert-danger d-none small py-2" role="alert">
          Invalid student ID or password!
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form">
          <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="username" placeholder="Student ID" value="student" required>
            <label for="username">Student ID / Username</label>
          </div>
          <div class="form-floating mb-3 text-start">
            <input type="password" class="form-control" id="password" placeholder="Password" value="password123" required>
            <label for="password">Password</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>

          <p class="mt-3 mb-0 small text-muted">
            Don't have an account? 
            <a href="#" id="show-register" class="text-decoration-none fw-bold">Register here</a>
          </p>
        </form>

        <form id="register-form" class="d-none">
          <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="reg-fullname" placeholder="Full Name" required>
            <label for="reg-fullname">Full Name</label>
          </div>
          <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="reg-username" placeholder="Student ID" required>
            <label for="reg-username">Student ID / Username</label>
          </div>
          <div class="form-floating mb-3 text-start">
            <input type="password" class="form-control" id="reg-password" placeholder="Password" required minlength="6">
            <label for="reg-password">Password (min. 6 chars)</label>
          </div>
          <div class="form-floating mb-3 text-start">
            <input type="password" class="form-control" id="reg-confirm-password" placeholder="Confirm Password" required>
            <label for="reg-confirm-password">Confirm Password</label>
          </div>
          <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Create Account</button>

          <p class="mt-3 mb-0 small text-muted">
            Already have an account? 
            <a href="#" id="show-login" class="text-decoration-none fw-bold">Sign In</a>
          </p>
        </form>


        <div id="demo-info" class="mt-4 p-2 bg-light rounded text-start border">
          <p class="text-muted mb-1 extra-small fw-bold">Log-In Information:</p>
          <code class="d-block text-dark">User: student</code>
          <code class="d-block text-dark">Pass: password123</code>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 COMET Student Performance Tracker | Aliy Aiman bin Alimun (IMS566)</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
